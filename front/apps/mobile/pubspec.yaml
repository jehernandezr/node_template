name: mobile_shell
description: "Shell móvil: compone los microfrontends móviles sobre shell_host."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  api:
    path: ../../packages/api
  auth:
    path: ../../packages/auth
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  i18n:
    path: ../../packages/i18n
  material_ui: 1.11.0
  mf_account:
    path: ../../microfrontends/account
  mf_assistant:
    path: ../../microfrontends/assistant
  mf_notifications:
    path: ../../microfrontends/notifications
  mf_tasks:
    path: ../../microfrontends/tasks
  mf_verifier:
    path: ../../microfrontends/verifier
  shell_core:
    path: ../../packages/shell_core
  shell_host:
    path: ../../packages/shell_host
  ui:
    path: ../../packages/ui

dev_dependencies:
  test_utils:
    path: ../../packages/test_utils
  contracts:
    path: ../../packages/contracts
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  go_router: 18.1.4

flutter:
  uses-material-design: true

resolution: workspace
