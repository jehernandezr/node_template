name: mf_verifier
description: "Microfrontend del verificador de inicios de sesión en el dispositivo."
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.14.0
  flutter: ">=1.17.0"

dependencies:
  auth:
    path: ../../packages/auth
  contracts:
    path: ../../packages/contracts
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^18.1.4
  i18n:
    path: ../../packages/i18n
  intl: ^0.20.3
  material_ui: ^1.11.0
  shell_core:
    path: ../../packages/shell_core
  ui:
    path: ../../packages/ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true

resolution: workspace
