name: shell_host
description: "Lo que comparten los shells web y móvil: sesión, login, paso adicional, páginas del shell, router y app raíz."
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.14.0
  flutter: ">=1.17.0"

dependencies:
  api:
    path: ../api
  auth:
    path: ../auth
  contracts:
    path: ../contracts
  flutter:
    sdk: flutter
  go_router: ^18.1.4
  i18n:
    path: ../i18n
  material_ui: ^1.11.0
  shell_core:
    path: ../shell_core
  ui:
    path: ../ui

dev_dependencies:
  test_utils:
    path: ../test_utils
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

resolution: workspace
