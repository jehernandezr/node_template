# Two importers: the root (Nx and git tooling) and backend/ (external backend
# dependencies). The libraries, apps and tools in backend/ are not packages: they are Nx projects
# imported through TypeScript aliases (backend/tsconfig.base.json).
packages:
  - 'backend'

# hoisted installs everything in a single flat node_modules at the root, with no node_modules
# folders inside backend/. Exact versions in both package.json files avoid nested copies.
nodeLinker: hoisted

# nx 24.0.0 pins undici 7.29.0, which has security advisories (GHSA-2m5v-pch6-74hx and others).
# 7.30.2 is a patch of the same major version. Remove when nx upgrades it.
overrides:
  undici: 7.30.2
  # glob 10 and 13 (GHSA-3g3m-2fjr-6pw4) is only fixed in the next major version.
  # Jest and test-exclude bring it in as development tools.
  'glob@>=10 <14': 14.0.6
