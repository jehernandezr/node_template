# Stack de desarrollo local.
#
# Pendiente antes de usar este archivo en CI: fijar versiones explícitas.
# Las imágenes sin versión (mailpit, openobserve:latest) deben pinearse
# a un tag concreto y revisado.
#
# Uso: docker compose up -d
# Guía completa: docs/local-development.md

name: node-template-local

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/local/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U platform -d platform']
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8
    ports:
      - '6379:6379'
    command: ['valkey-server', '--appendonly', 'yes']
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: sqs,sns,s3,scheduler,ses,secretsmanager
    ports:
      - '4566:4566'
    volumes:
      - localstack-data:/var/lib/localstack
      - ./infra/local/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fs http://localhost:4566/_localstack/health || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://localhost:8025/readyz || exit 1',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    environment:
      # Solo para desarrollo local. No reutilizar en ningún otro entorno.
      ZO_ROOT_USER_EMAIL: admin@local.test
      ZO_ROOT_USER_PASSWORD: localdev123
    ports:
      - '5080:5080'
    volumes:
      - openobserve-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:5080/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  valkey-data:
  localstack-data:
  openobserve-data:
