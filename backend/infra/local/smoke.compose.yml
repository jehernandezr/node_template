# Local smoke stack: the five service images, each with its API and its worker, behind one gateway, against
# PostgreSQL, Valkey and LocalStack (SNS and SQS from topology.json), with HMAC internal calls. It is the stack
# `pnpm nx run deploy-smoke:local` builds, migrates, seeds and tests; run it through
# backend/infra/scripts/local-smoke-cli.mjs, which generates the secrets and passes smoke.env.
# Shared service settings come from artifact-smoke.env; `environment` points them at this network.

x-service-environment: &service-environment
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  IDENTITY_ISSUER: http://identity:3000
  AUTH_ISSUER: http://identity:3000
  AUTH_JWKS_URL: http://identity:3000/v1/auth/jwks
  INTERNAL_API_BASE_URLS: '{"identity":"http://identity:3000","tasks":"http://tasks:3000","notifications":"http://notifications:3000","reports":"http://reports:3000","billing":"http://billing:3000"}'
  TRUST_PROXY_HOPS: '1'
  DB_USER: platform
  DB_PASSWORD: ${SMOKE_DB_PASSWORD:?generated by local-smoke-cli.mjs}
  DB_CATALOG_INSTANCE: main
  DB_INSTANCES: '{"main":{"primary":{"host":"postgres","port":5432}}}'
  VALKEY_URL: redis://valkey:6379
  INTERNAL_API_SHARED_SECRET: ${SMOKE_INTERNAL_API_SHARED_SECRET:?generated by local-smoke-cli.mjs}
  IDENTITY_SIGNING_KEYS: ${SMOKE_IDENTITY_SIGNING_KEYS:?generated by local-smoke-cli.mjs}
  IDENTITY_EMAIL_PEPPER: ${SMOKE_IDENTITY_EMAIL_PEPPER:?generated by local-smoke-cli.mjs}
  IDENTITY_TOKEN_PEPPER: ${SMOKE_IDENTITY_TOKEN_PEPPER:?generated by local-smoke-cli.mjs}
  IDENTITY_API_KEY_PEPPER: ${SMOKE_IDENTITY_API_KEY_PEPPER:?generated by local-smoke-cli.mjs}
  IDENTITY_DEVICE_ID_KEY: ${SMOKE_IDENTITY_DEVICE_ID_KEY:?generated by local-smoke-cli.mjs}
  IDENTITY_DATA_KEY: ${SMOKE_IDENTITY_DATA_KEY:?generated by local-smoke-cli.mjs}
  NOTIFICATIONS_EMAIL_PEPPER: ${SMOKE_NOTIFICATIONS_EMAIL_PEPPER:?generated by local-smoke-cli.mjs}

x-identity: &identity
  image: ${SMOKE_IMAGE_PREFIX:-local-smoke}/identity:smoke
  pull_policy: never
  env_file: [artifact-smoke.env]
  environment:
    <<: *service-environment
    SERVICE_NAME: identity
    DB_CATALOG_NAME: identity_catalog
    VALKEY_KEY_PREFIX: identity

x-tasks: &tasks
  image: ${SMOKE_IMAGE_PREFIX:-local-smoke}/tasks:smoke
  pull_policy: never
  env_file: [artifact-smoke.env]
  environment:
    <<: *service-environment
    SERVICE_NAME: tasks
    DB_CATALOG_NAME: tasks_catalog
    VALKEY_KEY_PREFIX: tasks

x-notifications: &notifications
  image: ${SMOKE_IMAGE_PREFIX:-local-smoke}/notifications:smoke
  pull_policy: never
  env_file: [artifact-smoke.env]
  environment:
    <<: *service-environment
    SERVICE_NAME: notifications
    DB_CATALOG_NAME: notifications_catalog
    VALKEY_KEY_PREFIX: notifications

x-reports: &reports
  image: ${SMOKE_IMAGE_PREFIX:-local-smoke}/reports:smoke
  pull_policy: never
  env_file: [artifact-smoke.env]
  environment:
    <<: *service-environment
    SERVICE_NAME: reports
    DB_CATALOG_NAME: reports_catalog
    VALKEY_KEY_PREFIX: reports

x-billing: &billing
  image: ${SMOKE_IMAGE_PREFIX:-local-smoke}/billing:smoke
  pull_policy: never
  env_file: [artifact-smoke.env]
  environment:
    <<: *service-environment
    SERVICE_NAME: billing
    DB_CATALOG_NAME: billing_catalog
    VALKEY_KEY_PREFIX: billing

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${SMOKE_DB_PASSWORD:?generated by local-smoke-cli.mjs}
    volumes:
      - ./postgres/init-smoke.sql:/docker-entrypoint-initdb.d/init.sql:ro

  valkey:
    image: valkey/valkey-bundle:8.1.11@sha256:3f57cc71a102e0e66991ae203b069038d8c3f6214ca887ff32f9a381091af8de

  localstack:
    image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    environment:
      SERVICES: sqs,sns,s3
      MESSAGING_NAME_PREFIX: local
      LOCALSTACK_HOST: localstack:4566
      SQS_ENDPOINT_STRATEGY: path
    volumes:
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
      - ./localstack/topology.py:/etc/localstack/topology.py:ro
      - ../terraform/topology.json:/etc/localstack/topology.json:ro

  identity: *identity
  identity-worker:
    <<: *identity
    command: ['node', 'worker.mjs']
  identity-seed:
    <<: *identity
    profiles: [seed]
    command: ['node', 'seed.mjs']
    environment:
      <<: *service-environment
      SERVICE_NAME: identity
      DB_CATALOG_NAME: identity_catalog
      VALKEY_KEY_PREFIX: identity
      IDENTITY_SMOKE_ACCOUNT: ${SMOKE_ACCOUNT:?set in smoke.env}

  tasks: *tasks
  tasks-worker:
    <<: *tasks
    command: ['node', 'worker.mjs']

  notifications: *notifications
  notifications-worker:
    <<: *notifications
    command: ['node', 'worker.mjs']

  reports: *reports
  reports-worker:
    <<: *reports
    command: ['node', 'worker.mjs']

  billing: *billing
  billing-worker:
    <<: *billing
    command: ['node', 'worker.mjs']

  gateway:
    image: nginx:1.31.8-alpine@sha256:fed7e14be83cbd2661a75cdc5b872d936cf155d46c327084d30b8df19ae88d72
    ports:
      - '127.0.0.1:${SMOKE_GATEWAY_PORT:-18480}:8080'
    volumes:
      - ./smoke-gateway.conf:/etc/nginx/nginx.conf:ro
