# The public edge of the local smoke stack: one origin that routes each path prefix to its service, as CloudFront
# and the load balancer do in AWS (the route_prefixes of environments/<env>/services/<service>). The SSE stream is
# not buffered.
events {}

http {
  access_log off;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header Connection '';

  server {
    listen 8080;

    location = /v1/notifications/stream {
      proxy_pass http://notifications:3000;
      proxy_buffering off;
      proxy_read_timeout 1h;
    }

    location ~ ^/v1/(auth|me|tenant|tenants|invitations|sagas)(/|$) {
      proxy_pass http://identity:3000;
    }

    location ~ ^/v1/tasks(/|$) {
      proxy_pass http://tasks:3000;
    }

    location ~ ^/v1/(notifications|notification-preferences)(/|$) {
      proxy_pass http://notifications:3000;
    }

    location ~ ^/v1/reports(/|$) {
      proxy_pass http://reports:3000;
    }

    location ~ ^/v1/billing(/|$) {
      proxy_pass http://billing:3000;
    }

    location / {
      return 404;
    }
  }
}
