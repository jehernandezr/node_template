name: Mobile release

# Android release builds need gen_snapshot, which Flutter only publishes for
# x86_64 hosts (flutter/flutter#168980). That is why they are built here and not on Linux ARM64 machines.
on:
  workflow_dispatch:
  push:
    tags:
      - 'mobile-v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (APK and AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Read the Flutter version
        id: flutter-version
        run: echo "version=$(tr -d '[:space:]' < front/.flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      # Without these secrets the release is signed with the debug key: good for testing,
      # not for publishing to the Play Store.
      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: front/apps/mobile/android
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64: signing with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties

      - run: flutter pub get
        working-directory: front

      - run: flutter build apk --release
        working-directory: front/apps/mobile

      - run: flutter build appbundle --release
        working-directory: front/apps/mobile

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release
          path: |
            front/apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            front/apps/mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    name: iOS (unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the Flutter version
        id: flutter-version
        run: echo "version=$(tr -d '[:space:]' < front/.flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - run: flutter pub get
        working-directory: front

      # Signing for the App Store needs an Apple certificate and profile; until they exist,
      # it builds without signing to check that the iOS project still builds.
      - run: flutter build ios --release --no-codesign
        working-directory: front/apps/mobile

      - name: Package Runner.app
        working-directory: front/apps/mobile/build/ios/iphoneos
        run: zip -qr Runner.app.zip Runner.app

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-unsigned
          path: front/apps/mobile/build/ios/iphoneos/Runner.app.zip
          if-no-files-found: error
