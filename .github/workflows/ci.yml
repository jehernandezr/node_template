name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      web: ${{ steps.filter.outputs.web }}
      terraform: ${{ steps.filter.outputs.terraform }}
      backend: ${{ steps.filter.outputs.backend }}
      artifact: ${{ steps.filter.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            # Everything that changes the exported JSON, the topology, AsyncAPI or the generated Dart.
            contracts:
              - 'backend/libs/contracts/**'
              - 'backend/libs/platform/messaging/**'
              - 'backend/tools/contracts-export/**'
              - 'backend/tsconfig.base.json'
              - 'backend/infra/terraform/topology.json'
              - 'pnpm-lock.yaml'
              - '.prettierrc'
              - 'front/packages/contracts/**'
              - 'front/packages/i18n/lib/src/generated/**'
              - 'front/pubspec.lock'
              - 'front/tools/**'
              - '.github/workflows/ci.yml'
            web:
              - 'front/**'
              - '.github/workflows/ci.yml'
            terraform:
              - 'backend/infra/**'
              - '.github/workflows/**'
              - '.nvmrc'
            # Everything that can change what a backend test-int target runs.
            backend:
              - 'backend/**'
              - 'nx.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.nvmrc'
              - '.github/workflows/ci.yml'
            # Everything that changes a service image or Lambda package.
            artifact:
              - 'backend/**'
              - '.github/workflows/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.dockerignore'
              - '.nvmrc'

  nx:
    name: Nx affected (backend and front)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Read the Flutter version
        id: flutter-version
        run: echo "version=$(tr -d '[:space:]' < front/.flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - run: pnpm install --frozen-lockfile

      # pnpm-workspace.yaml uses nodeLinker: hoisted; a node_modules folder inside
      # backend/ means a duplicated dependency or a library with its own package.json.
      - name: Single node_modules
        run: |
          extra=$(find . -path ./node_modules -prune -o -name node_modules -type d -print -prune)
          if [ -n "$extra" ]; then
            echo "::error::There are node_modules outside the root: $extra"
            exit 1
          fi

      - run: flutter pub get
        working-directory: front

      - name: Backend and front structure
        run: |
          node .claude/skills/backend-structure/scripts/check-structure.mjs --all .
          node .claude/skills/front-structure/scripts/check-structure.mjs --all .

      # The bootstrap and configuration files of the reference service match the service template.
      - name: Generator templates match the reference service
        run: pnpm nx run generators:verify --skip-nx-cache

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'front/pubspec.lock') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'front/pubspec.lock') }}-
            nx-${{ runner.os }}-

      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      - run: pnpm nx affected -t lint typecheck build analyze format-check

      # Unit tests only, with parallel workers and no containers. Coverage is enforced by the test-int shards, which
      # run each project's unit and container tests together.
      - name: Backend unit tests
        run: pnpm nx affected -t test --exclude='tag:lang:dart'

      # The five services in one process with real PostgreSQL and Valkey: tenant signup, tasks, notices, reports,
      # invoice and tenant move. Without Docker it must fail, not pass with zero tests.
      - name: Platform end-to-end flow
        run: pnpm nx affected -t e2e
        env:
          INTEGRATION_TESTS: require

      - name: Front tests
        run: pnpm nx affected -t test --exclude='*,!tag:lang:dart'

      - run: pnpm nx format:check

      # A freshly generated service and module pass lint, test, typecheck and build in a copy of the workspace.
      - name: Generator smoke test
        run: pnpm nx run generators:smoke

  # The container suites of the affected projects, split by project across the runners of a matrix. Each shard
  # runs test-int:ci, one Jest run per project with its own globalSetup, so every run starts its own PostgreSQL
  # and Valkey and no container is shared across shards. Each shard uploads the coverage summary of its projects;
  # the coverage job merges them and enforces the threshold.
  test-int:
    name: Backend tests with coverage (shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx/cache
          key: nx-test-int-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-test-int-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-test-int-${{ matrix.shard }}-${{ runner.os }}-

      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      - name: Projects of this shard
        id: shard
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 3
        run: |
          projects=$(pnpm nx show projects --affected --withTarget=test-int --json | node -e '
            const all = JSON.parse(require("fs").readFileSync(0, "utf8")).sort();
            const [shard, shards] = [Number(process.env.SHARD), Number(process.env.SHARDS)];
            console.log(all.filter((_, index) => index % shards === shard - 1).join(","));
          ')
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "Shard $SHARD: ${projects:-none}"

      - name: Unit and container tests with minimum coverage
        if: steps.shard.outputs.projects != ''
        env:
          INTEGRATION_TESTS: require
          PROJECTS: ${{ steps.shard.outputs.projects }}
        run: >-
          pnpm nx run-many -t test-int -c ci --projects="$PROJECTS" --parallel=1
          --coverage --coverageReporters=text-summary --coverageReporters=json-summary

      - name: Coverage summaries of this shard
        if: steps.shard.outputs.projects != ''
        env:
          PROJECTS: ${{ steps.shard.outputs.projects }}
        run: node .claude/guards/coverage-report.mjs collect --projects "$PROJECTS" --out "$RUNNER_TEMP/coverage"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.shard.outputs.projects != ''
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/coverage
          retention-days: 3

  # The coverage of every shard in one report: a project that no shard covered, or one under the threshold of
  # backend/jest.preset.js, fails here.
  coverage:
    name: Backend coverage
    needs: [changes, test-int]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-shard-*
          path: ${{ runner.temp }}/coverage
          merge-multiple: true

      - name: Merged coverage of the affected projects
        run: |
          projects=$(pnpm nx show projects --affected --withTarget=test-int --json | node -e '
            console.log(JSON.parse(require("fs").readFileSync(0, "utf8")).join(","));
          ')
          node .claude/guards/coverage-report.mjs check --projects "$projects" --in "$RUNNER_TEMP/coverage"

  # The guards of the repository: the language check, the guard and rule tests (rule-checks.md covers every rule,
  # each guard fails on its fixture) and the commit messages of a pull request.
  guards:
    name: Guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Language of the developer text
        run: node .claude/guards/check-language.mjs --all .

      - name: Guard, rule and tool tests
        run: pnpm nx run backend-tooling:tooling-test --skip-nx-cache

      - name: Tooling lint
        run: pnpm nx run backend-tooling:lint --skip-nx-cache

      - name: Commit messages of the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pnpm exec commitlint --from "$BASE" --to "$HEAD"
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            node .claude/guards/check-language.mjs --commit-msg "$RUNNER_TEMP/message"
          done

  contracts:
    name: Contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Read the Flutter version
        id: flutter-version
        run: echo "version=$(tr -d '[:space:]' < front/.flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - run: pnpm install --frozen-lockfile

      # check covers contract.json, asyncapi.json and backend/infra/terraform/topology.json.
      - name: Contract export and topology drift
        run: pnpm nx run contracts-export:check

      - name: Generated Dart drift
        run: |
          flutter pub get
          dart run contracts_gen --check
        working-directory: front

  web-deferred:
    name: Deferred web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the Flutter version
        id: flutter-version
        run: echo "version=$(tr -d '[:space:]' < front/.flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true

      - run: flutter pub get
        working-directory: front

      - run: flutter build web --release --source-maps
        working-directory: front/apps/web

      - name: Check that the microfrontends stay deferred
        run: dart run ../../tools/check_deferred_chunks.dart
        working-directory: front/apps/web

  # Builds the ARM64 image and the Lambda package of every service natively on an ARM runner and proves they
  # start: inside each image migrate.mjs exits 0 and main.mjs answers the readiness route against the PostgreSQL and
  # Valkey of backend/docker-compose.yml, and each package loads its handler.
  artifact-smoke:
    name: Artifact smoke (ARM64)
    needs: changes
    if: needs.changes.outputs.artifact == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Bundle the services
        run: pnpm nx run-many -t build --projects='tag:type:app'

      - name: Build, migrate and start every service artifact
        run: node backend/infra/scripts/artifact-smoke-cli.mjs

  local-smoke:
    name: Local smoke (deploy-smoke on the local stack)
    needs: changes
    if: needs.changes.outputs.artifact == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Builds the bundles and the images, runs smoke.compose.yml, and seeds and runs deploy-smoke twice.
      - name: Run deploy-smoke twice against the local stack
        run: pnpm nx run deploy-smoke:local

  terraform:
    name: Terraform
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend/infra/terraform
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-terraform does not read version files: they are read here, as with Flutter.
      - name: Read the Terraform and tflint versions
        id: versions
        run: |
          echo "terraform=$(tr -d '[:space:]' < .terraform-version)" >> "$GITHUB_OUTPUT"
          echo "tflint=v$(tr -d '[:space:]' < .tflint-version)" >> "$GITHUB_OUTPUT"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.versions.outputs.terraform }}
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ steps.versions.outputs.tflint }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: terraform fmt -check -recursive

      - name: init, validate and terraform test (stacks and examples)
        run: node ../scripts/tf-validate.mjs

      - name: Python Lambda and script tests
        run: |
          python3 -B -I -m unittest discover -s modules/rds-postgres/lambda/db_bootstrap -v
          python3 -B -I -m unittest discover -s modules/http-api/authorizer -v
          python3 -B -I -m unittest discover -s ../local/localstack -v

      - name: Pipeline script tests
        run: node --test ../scripts/__tests__/*.test.mjs

      - name: Bootstrap vendor/ matches requirements.txt
        run: python3 -B -I ../scripts/check_vendor.py modules/rds-postgres/lambda/db_bootstrap

      - name: shellcheck of the infrastructure scripts
        run: shellcheck -x --source-path=SCRIPTDIR ../scripts/*.sh ../local/localstack/*.sh

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl" --minimum-failure-severity=error

  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - changes
      - nx
      - test-int
      - coverage
      - guards
      - contracts
      - web-deferred
      - terraform
      - artifact-smoke
      - local-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::Some jobs failed or were cancelled."
              exit 1
            fi
          done
