# Despliegue del backend por ambiente. Los servicios se descubren recorriendo
# backend/infra/terraform/environments/<ambiente>/services/*, sin lista fija.
# El entorno de GitHub con el mismo nombre que el ambiente es el que acepta la política de
# confianza del rol de OIDC. En prod ponle revisores requeridos.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente a desplegar
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev
      stacks:
        description: Aplica network, platform, data, messaging y edge antes de los servicios
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  ENVIRONMENT: ${{ inputs.environment || 'dev' }}

jobs:
  discover:
    name: Descubrir servicios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Listar los servicios del ambiente
        id: matrix
        run: |
          matrix=$(node backend/infra/scripts/service-catalog-cli.mjs matrix "$ENVIRONMENT")
          count=$(node -e "process.stdout.write(String(JSON.parse(process.argv[1]).include.length))" "$matrix")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

  stacks:
    name: Stacks del ambiente
    needs: discover
    if: github.event_name == 'push' || inputs.stacks
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    environment: ${{ inputs.environment || 'dev' }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Leer la versión de Terraform
        id: terraform-version
        run: echo "version=$(tr -d '[:space:]' < backend/infra/terraform/.terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Credenciales del rol de despliegue
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Planear y aplicar los stacks en orden
        run: |
          for stack in network platform data messaging edge; do
            if [ ! -d "backend/infra/terraform/environments/$ENVIRONMENT/$stack" ]; then
              continue
            fi
            ENV="$ENVIRONMENT" backend/infra/scripts/deploy-aws.sh plan "$stack"
            ENV="$ENVIRONMENT" backend/infra/scripts/deploy-aws.sh apply "$stack"
          done

  services:
    name: Servicio ${{ matrix.name }}
    needs:
      - discover
      - stacks
    if: >-
      always() &&
      needs.discover.outputs.count != '0' &&
      needs.stacks.result != 'failure' &&
      needs.stacks.result != 'cancelled'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    environment: ${{ inputs.environment || 'dev' }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      SERVICE: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Leer la versión de Terraform
        id: terraform-version
        run: echo "version=$(tr -d '[:space:]' < backend/infra/terraform/.terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Credenciales del rol de despliegue
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Leer las salidas de platform
        run: backend/infra/scripts/read-platform-outputs.sh "$ENVIRONMENT"

      - name: Credenciales del rol de publicación
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publicar el artefacto
        run: backend/infra/scripts/deploy-service.sh "$ENVIRONMENT" "$SERVICE" publish

      - name: Credenciales del rol de despliegue para el servicio
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Migrar la base del servicio
        run: backend/infra/scripts/deploy-service.sh "$ENVIRONMENT" "$SERVICE" migrate

      - name: Planear el servicio
        run: backend/infra/scripts/deploy-service.sh "$ENVIRONMENT" "$SERVICE" plan

      - name: Aplicar el servicio
        run: backend/infra/scripts/deploy-service.sh "$ENVIRONMENT" "$SERVICE" apply
